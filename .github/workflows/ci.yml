name: e2e

on:
  push:
    branches: [main, rewrite-in-rust]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: unit + e2e (${{ matrix.arch }}, Alpine, seccomp)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (core, ${{ matrix.arch }} target)
        run: cargo clippy -p cvisor-core --target ${{ matrix.target }} --tests -- -D warnings

      # cVisor installs its own seccomp filter, so the tests must run in a
      # container with the default seccomp profile disabled. `cargo xtask test`
      # cross-compiles static musl binaries and runs each — unit tests and the
      # real-command e2e suite (tests/passthrough.rs) — inside Alpine via
      # `docker run --security-opt seccomp=unconfined`. Each runner is native
      # for its arch, so there is no emulation.
      - name: Unit + e2e tests
        run: cargo xtask test --arch ${{ matrix.arch }}
