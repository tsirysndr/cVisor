name: e2e

on:
  push:
    branches: [main, rewrite-in-rust]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: unit + e2e (${{ matrix.arch }}, Alpine, seccomp)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (core, ${{ matrix.arch }} target)
        run: cargo clippy -p cvisor-core --target ${{ matrix.target }} --tests -- -D warnings

      # cVisor installs its own seccomp filter, so the tests must run in a
      # container with the default seccomp profile disabled. `cargo xtask test`
      # cross-compiles static musl binaries and runs each — unit tests and the
      # real-command e2e suite (tests/passthrough.rs) — inside Alpine via
      # `docker run --security-opt seccomp=unconfined`. Each runner is native
      # for its arch, so there is no emulation.
      - name: Unit + e2e tests
        run: cargo xtask test --arch ${{ matrix.arch }}

  sdks:
    name: sdk e2e (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Zig + cargo-zigbuild
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - uses: Swatinem/rust-cache@v2
        with:
          key: sdks-${{ matrix.arch }}

      # Build the C-ABI cdylib (libcvisor.so) and distribute it into each SDK's
      # native dir. Also patches the musl NEEDED soname so it loads on any musl
      # image. All SDK tests run under seccomp=unconfined (the sandbox installs
      # its own filter) and apparmor=unconfined (it uses ptrace-class ops).
      - name: Build libcvisor.so (${{ matrix.arch }})
        run: cargo xtask ffi --arch ${{ matrix.arch }}

      - name: Python SDK (ctypes, uv)
        run: |
          docker run --rm \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            -e CVISOR_LIB=/sdk/cvisor/_native/libcvisor-${{ matrix.arch }}.so \
            -e UV_CACHE_DIR=/tmp/uvcache \
            -v "$PWD/sdks/python:/sdk" -w /sdk \
            ghcr.io/astral-sh/uv:python3.12-alpine uv run --group dev pytest -q

      - name: Ruby SDK (fiddle)
        run: |
          docker run --rm \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            -e CVISOR_LIB=/sdk/native/libcvisor-${{ matrix.arch }}.so \
            -v "$PWD/sdks/ruby:/sdk" -w /sdk \
            ruby:alpine ruby test/test_sandbox.rb

      # The Bun and Deno entries live in the Node package (cvisor's "bun" and
      # "deno" export conditions) and load libcvisor.so from the platform
      # packages; xtask ffi drops the musl build there (npm arch naming).
      - name: Bun SDK (bun:ffi entry of the Node package)
        run: |
          NPM_ARCH=$([ "${{ matrix.arch }}" = "aarch64" ] && echo arm64 || echo x64)
          docker run --rm \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            -e CVISOR_LIB=/sdk/platforms/linux-${NPM_ARCH}-musl/libcvisor.so \
            -v "$PWD/sdks/node:/sdk" -w /sdk \
            oven/bun:alpine bun test-bun.ts

      - name: Deno SDK (Deno.dlopen entry of the Node package)
        run: |
          NPM_ARCH=$([ "${{ matrix.arch }}" = "aarch64" ] && echo arm64 || echo x64)
          docker run --rm \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            -e CVISOR_LIB=/sdk/platforms/linux-${NPM_ARCH}-musl/libcvisor.so \
            -v "$PWD/sdks/node:/sdk" -w /sdk \
            --entrypoint sh denoland/deno:alpine \
            -c 'deno run --allow-ffi --allow-env --unstable-sloppy-imports test-deno.ts'

      - name: Erlang SDK (NIF)
        run: |
          docker run --rm \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            -e CVISOR_LIB=/sdk/priv/libcvisor-${{ matrix.arch }}.so \
            -v "$PWD/sdks/erlang:/sdk" -w /sdk \
            erlang:alpine sh -c '
              apk add --no-cache build-base >/dev/null 2>&1 &&
              make all &&
              erlc -o ebin test/cvisor_test.erl &&
              erl -noshell -pa ebin -eval "cvisor_test:run()" -s init stop'

      # Node uses the napi module (libcvisor.node) in the Debian bun image;
      # cargo xtask run-node builds it and runs test.ts (which asserts + prints
      # NODE_SDK_OK).
      - name: Node SDK (napi)
        run: cargo xtask run-node

  cache-s3:
    name: cache e2e over S3 (minio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: cache-s3

      - name: Install musl C toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # Run minio as a plain container (a GH service container can't set the
      # required `server /data` command) and create the bucket with mc.
      - name: Start minio + bucket
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break || sleep 1
          done
          docker run --rm --network host --entrypoint sh minio/mc -c '
            mc alias set m http://localhost:9000 minioadmin minioadmin &&
            mc mb --ignore-existing m/cvisor-cache'

      # Build the CLI with the s3 (and zstd) features — the C deps compile with
      # the native musl toolchain.
      - name: Build cvisor (--features zstd,s3)
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build -p cvisor-core --bin cvisor --target x86_64-unknown-linux-musl --release --features zstd,s3

      # The sandbox needs seccomp=unconfined, so run the binary inside an Alpine
      # container on the host network (to reach minio at :9000).
      - name: Cache save/restore/ls/rm over S3
        run: |
          CV=target/x86_64-unknown-linux-musl/release/cvisor
          docker run --rm --network host \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            -e AWS_ACCESS_KEY_ID=minioadmin -e AWS_SECRET_ACCESS_KEY=minioadmin \
            -v "$PWD/$CV:/bin/cvisor" --entrypoint sh alpine -c '
              set -e
              BK="s3://cvisor-cache/builds?endpoint=http://localhost:9000&region=us-east-1"
              cvisor --sandbox s -- sh -c "mkdir -p /work && echo s3-content > /work/a.txt"
              cvisor --sandbox s  --cache-backend "$BK" cache save deps-v1 sb:/work
              cvisor --cache-backend "$BK" cache ls | grep deps-v1
              # exact restore into a fresh sandbox
              cvisor --sandbox s2 --cache-backend "$BK" cache restore deps-v1 sb:/work
              cvisor --sandbox s2 -- grep s3-content /work/a.txt
              # prefix (restore-key) hit
              cvisor --sandbox s3 --cache-backend "$BK" cache restore deps sb:/work
              cvisor --sandbox s3 -- grep s3-content /work/a.txt
              cvisor --cache-backend "$BK" cache rm --all
              echo S3_CACHE_OK'

      - name: Stop minio
        if: always()
        run: docker rm -f minio || true
