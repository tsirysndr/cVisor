name: desktop

# Build the Tauri desktop app for macOS + Linux on version tags and attach the
# bundles (.dmg / .app.tar.gz, .deb / .rpm / .AppImage) to the same GitHub
# Release the CLI release workflow publishes for that tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: cVisor Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            name: macos-aarch64
            target: aarch64-apple-darwin
          - runner: macos-13
            name: macos-x86_64
            target: x86_64-apple-darwin
          - runner: ubuntu-22.04
            name: linux-x86_64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            name: linux-aarch64
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.name }}
          workspaces: ui/src-tauri

      # Tauri v2 Linux build deps (webkitgtk 4.1) + ayatana for the tray icon.
      - name: Install Linux dependencies
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: cd ui && bun install

      # Builds the frontend (beforeBuildCommand), compiles the Tauri app for
      # the matrix target, bundles it, and uploads the bundles to the GitHub
      # Release for this tag (created if the CLI workflow hasn't yet). A manual
      # workflow_dispatch from a branch has no tag, so it builds without
      # uploading (empty tagName skips the release step).
      - name: Build and upload desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ui
          tauriScript: bun run tauri
          args: --target ${{ matrix.target }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseDraft: false
          prerelease: false
