name: docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: ${{ matrix.variant }} → ghcr.io/tsirysndr/cvisor
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Alpine (default): cvisor:latest, cvisor:<version>
          - variant: alpine
            dockerfile: Dockerfile
            prefix: ""
          # Debian trixie: cvisor:trixie-latest, cvisor:trixie-<version>
          - variant: debian-trixie
            dockerfile: Dockerfile.debian
            prefix: trixie-
          # Ubuntu 26.04: cvisor:ubuntu-latest, cvisor:ubuntu-<version>
          - variant: ubuntu
            dockerfile: Dockerfile.ubuntu
            prefix: ubuntu-
    steps:
      - uses: actions/checkout@v4

      # Build Cloud needs a Docker Hub login on an account entitled to the
      # builder; this must run before the builder is set up.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: tsiry
          password: ${{ secrets.DOCKER_PAT }}

      # No setup-qemu-action: Build Cloud has native amd64 and arm64 machines,
      # so the arm64 half of the matrix is no longer emulated.
      - name: Set up Docker Build Cloud
        uses: docker/setup-buildx-action@v3
        with:
          version: "lab:latest"
          driver: cloud
          endpoint: "tsiry/default"
          install: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `<prefix>latest` on a tag push or a manual run, plus `<prefix><version>`
      # from a v* tag: e.g. latest / 1.2.3, trixie-latest / trixie-1.2.3,
      # ubuntu-latest / ubuntu-1.2.3.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/tsirysndr/cvisor
          tags: |
            type=raw,value=${{ matrix.prefix }}latest,enable=${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
            type=semver,pattern=${{ matrix.prefix }}{{version}}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No cache-from/cache-to: the cloud builder keeps its own persistent
          # shared cache, so an extra registry export would only add upload time.
