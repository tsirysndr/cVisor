name: docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: ${{ matrix.variant }} → ghcr.io/tsirysndr/cvisor
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Alpine (default): cvisor:latest, cvisor:<version>
          - variant: alpine
            dockerfile: Dockerfile
            prefix: ""
          # Debian trixie: cvisor:trixie-latest, cvisor:trixie-<version>
          - variant: debian-trixie
            dockerfile: Dockerfile.debian
            prefix: trixie-
          # Ubuntu 26.04: cvisor:ubuntu-latest, cvisor:ubuntu-<version>
          - variant: ubuntu
            dockerfile: Dockerfile.ubuntu
            prefix: ubuntu-
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `<prefix>latest` on a tag push or a manual run, plus `<prefix><version>`
      # from a v* tag: e.g. latest / 1.2.3, trixie-latest / trixie-1.2.3,
      # ubuntu-latest / ubuntu-1.2.3.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/tsirysndr/cvisor
          tags: |
            type=raw,value=${{ matrix.prefix }}latest,enable=${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
            type=semver,pattern=${{ matrix.prefix }}{{version}}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry cache rather than type=gha: Actions cache is scoped per ref,
          # and this workflow only runs on tags, so each tag build would write a
          # scope no later tag can read. A GHCR-hosted cache has no ref scoping
          # (and no 10 GB repo cap). image-manifest=true keeps GHCR happy.
          cache-from: type=registry,ref=ghcr.io/tsirysndr/cvisor:buildcache-${{ matrix.variant }}
          cache-to: type=registry,ref=ghcr.io/tsirysndr/cvisor:buildcache-${{ matrix.variant }},mode=max,image-manifest=true,oci-mediatypes=true
