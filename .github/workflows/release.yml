name: release

on:
  push:
    tags: ["v*"]

# Needed for softprops/action-gh-release to create the GitHub Release.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build cvisor (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.arch }}

      # Each runner is native for its arch, so this is not cross-compilation.
      # The musl targets link statically via rust-lld (see .cargo/config.toml),
      # producing a self-contained binary that runs on any Linux of that arch.
      - name: Build cvisor (static musl)
        run: cargo build -p cvisor-core --bin cvisor --target ${{ matrix.target }} --release

      - name: Stage artifact
        run: |
          bin="cvisor-linux-${{ matrix.arch }}"
          install -Dm755 "target/${{ matrix.target }}/release/cvisor" "$bin"
          sha256sum "$bin" > "$bin.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: cvisor-linux-${{ matrix.arch }}
          path: |
            cvisor-linux-${{ matrix.arch }}
            cvisor-linux-${{ matrix.arch }}.sha256
          if-no-files-found: error

  release:
    name: publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
