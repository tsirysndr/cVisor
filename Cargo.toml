[workspace]
resolver = "2"
members = [
    "crates/cvisor-core",
    "crates/cvisor-cli",
    "crates/cvisor-node",
    "crates/cvisor-ffi",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/butter-dot-dev/cVisor"

[workspace.dependencies]
libc = "0.2"
nix = { version = "0.30", default-features = false }
getrandom = "0.3"
crossbeam-channel = "0.5"
tar = "0.4"
flate2 = "1.0"
zstd = "0.13"
ignore = "0.4"
rust-s3 = { version = "0.35", default-features = false, features = [
    "blocking",
    "tokio-rustls-tls",
] }
