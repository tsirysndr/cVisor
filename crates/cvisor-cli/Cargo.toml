[package]
name = "cvisor-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cvisor"
path = "src/main.rs"

[features]
# Forward the optional archive/backend features to cvisor-core. The distributed
# musl builds stay pure-Rust by default; enable these on a host where the C deps
# build (native Linux) for `--format zstd` / `cache --backend s3://...`.
zstd = ["cvisor-core/zstd"]
s3 = ["cvisor-core/s3"]

[dependencies]
cvisor-core = { path = "../cvisor-core" }
# Remote mode (`--remote`): a gRPC client to a cvisord daemon. Portable, so the
# CLI can drive a remote Linux daemon from any host.
cvisor-proto = { path = "../cvisor-proto" }
tonic = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-std", "io-util", "signal"] }
tokio-stream = "0.1"
futures-util = "0.3"
libc = { workspace = true }
# `cvisor ui`: serve the embedded web UI (built from ui/) and open a browser.
rust-embed = "8"
tiny_http = "0.12"
open = "5"

# macOS: the local in-process sandbox is Linux-only, so on macOS the CLI
# transparently boots a reusable bsdkrun microVM (named `cvisor-sandbox`) from
# the cVisor image, runs `cvisord` inside it, and drives the CLI against that
# daemon. bsdkrun-sdk isn't published, so it's pulled by git; being target-gated
# to macOS, the Linux CI never builds or fetches it (the committed Cargo.lock
# pins it), so `cargo build` on Linux is unaffected.
[target.'cfg(target_os = "macos")'.dependencies]
bsdkrun-sdk = { git = "https://github.com/tsirysndr/bsdkrun" }
