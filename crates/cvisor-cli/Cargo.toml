[package]
name = "cvisor-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cvisor"
path = "src/main.rs"

[features]
# Forward the optional archive/backend features to cvisor-core. The distributed
# musl builds stay pure-Rust by default; enable these on a host where the C deps
# build (native Linux) for `--format zstd` / `cache --backend s3://...`.
zstd = ["cvisor-core/zstd"]
s3 = ["cvisor-core/s3"]

[dependencies]
cvisor-core = { path = "../cvisor-core" }
# Remote mode (`--remote`): a gRPC client to a cvisord daemon. Portable, so the
# CLI can drive a remote Linux daemon from any host.
cvisor-proto = { path = "../cvisor-proto" }
tonic = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-std", "io-util", "signal"] }
tokio-stream = "0.1"
futures-util = "0.3"
libc = { workspace = true }
# `cvisor ui`: serve the embedded web UI (built from ui/) and open a browser.
rust-embed = "8"
tiny_http = "0.12"
open = "5"
