[package]
name = "cvisor-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "cvisor_core"
path = "src/lib.rs"

[[bin]]
name = "smoke"
path = "src/bin/smoke.rs"

[features]
# Panic on unimplemented syscalls instead of silently returning ENOSYS.
fail-loudly = []
# zstd archive compression. Off by default: zstd-sys is a C library that does
# not cross-compile under cargo-zigbuild on a macOS host, so the distributed
# musl builds stay pure-Rust (gzip/estargz/uncompressed). Enable on a host where
# zstd-sys builds (e.g. native Linux) for `--format zstd` support.
zstd = ["dep:zstd"]
# S3 cache backend. Off by default (pulls a networking stack); enable for
# `cache --backend s3://...`.
s3 = ["dep:rust-s3"]
# SQLite persistence (the `store` module) via sqlx. Off by default (async +
# bundled C SQLite); the daemon enables it to persist sandbox state across
# restarts. Not enabled for the pure-Rust FFI/CLI builds.
sqlx = ["dep:sqlx", "dep:serde_json"]

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }
nix = { workspace = true, features = [
    "process", "fs", "poll", "socket", "uio", "signal",
    "event", "ioctl", "sched", "dir",
] }
crossbeam-channel = { workspace = true }

[dependencies]
getrandom = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
zstd = { workspace = true, optional = true }
ignore = { workspace = true }
rust-s3 = { workspace = true, optional = true }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio", "sqlite",
], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
