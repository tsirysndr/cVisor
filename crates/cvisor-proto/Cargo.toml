[package]
name = "cvisor-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The gRPC contract shared by the daemon (server) and the CLI (remote client).
# Pure Rust and portable, so the CLI can talk to a remote Linux daemon from any
# host.

[dependencies]
tonic = "0.12"
prost = "0.13"

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"
