# Lets the Gleam SDK (../gleam) consume this Erlang app as a local path
# dependency. Harmless to the Erlang tooling (rebar3/mix ignore it). The NIF
# (priv/cvisor_nif.so) is built by the Makefile / rebar3 pre-hook, not by Gleam,
# so build it before compiling a Gleam consumer (`make -C sdks/erlang`).
name = "cvisor"
version = "0.3.0"
target = "erlang"

[dependencies]
