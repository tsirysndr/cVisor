[project]
name = "cvisor"
version = "0.0.6"
description = "In-process Linux sandbox — Python SDK (ctypes FFI over libcvisor)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "butter.dev" }]
keywords = ["sandbox", "seccomp", "linux", "isolation"]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
# Pure-ctypes wrapper — no runtime dependencies.
dependencies = []

[project.optional-dependencies]
# Rich interactive console (`cvisor`). Without it the console falls back to the
# stdlib REPL.
console = ["ipython>=8"]

[project.scripts]
# `cvisor` (or `python -m cvisor`) launches the interactive console.
cvisor = "cvisor.console:main"

[project.urls]
Homepage = "https://github.com/butter-dot-dev/cVisor"
Repository = "https://github.com/butter-dot-dev/cVisor"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cvisor"]

# The compiled libcvisor.so is placed in cvisor/_native/ by the build step
# (`cargo xtask ffi`) and shipped inside the wheel.
[tool.hatch.build.targets.wheel.force-include]
"cvisor/_native" = "cvisor/_native"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = true
