[project]
name = "bvisor"
version = "0.0.6"
description = "In-process Linux sandbox — Python SDK (ctypes FFI over libbvisor)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "butter.dev" }]
keywords = ["sandbox", "seccomp", "linux", "isolation"]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
# Pure-ctypes wrapper — no runtime dependencies.
dependencies = []

[project.urls]
Homepage = "https://github.com/butter-dot-dev/bVisor"
Repository = "https://github.com/butter-dot-dev/bVisor"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bvisor"]

# The compiled libbvisor.so is placed in bvisor/_native/ by the build step
# (`cargo xtask ffi`) and shipped inside the wheel.
[tool.hatch.build.targets.wheel.force-include]
"bvisor/_native" = "bvisor/_native"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = true
