[package]
name = "cvisor-ui"
version = "0.1.0"
description = "cVisor desktop UI"
edition = "2021"

# Standalone workspace so this desktop crate is not pulled into the parent
# cVisor Cargo workspace (crates/* + xtask).
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# gRPC client to the cvisord daemon (desktop transport).
cvisor-proto = { path = "../../crates/cvisor-proto" }
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tokio-stream = "0.1"
base64 = "0.22"
# host PTY sessions (agent panel host mode)
libc = "0.2"

[features]
# used by tauri to enable custom-protocol in release builds
custom-protocol = ["tauri/custom-protocol"]
