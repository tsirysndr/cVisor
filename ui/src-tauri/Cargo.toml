[package]
name = "cvisor-ui"
version = "0.1.0"
description = "cVisor desktop UI"
edition = "2021"

# Standalone workspace so this desktop crate is not pulled into the parent
# cVisor Cargo workspace (crates/* + xtask).
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# used by tauri to enable custom-protocol in release builds
custom-protocol = ["tauri/custom-protocol"]
