      <stop offset="0" stop-color="#874BFD"/>
      <stop offset="1" stop-color="#7D56F4"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="#171717"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#2E2E34" stroke-width="4"/>
